apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: dev
  labels:
    app: demo-api
spec:
  type: ClusterIP
  selector:
    app: demo-api      # выбирает поды по метке
  ports:
    - name: http
      port: 80         # порт самого сервиса
      targetPort: http # именованный порт контейнера (8000)
      protocol: TCP
