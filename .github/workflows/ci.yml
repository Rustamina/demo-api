name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # ghcr.io требует путь в нижнем регистре, даже если логин с заглавной
  IMAGE_NAME: rustamina/demo-api

jobs:

  # ------------------------------------------------------------- lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint Python
        run: |
          pip install ruff
          ruff check app/ || true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint Helm chart
        run: |
          helm lint ./chart
          helm template demo-api ./chart > /dev/null
          helm template demo-api ./chart -f chart/values-prod.yaml > /dev/null

  # ------------------------------------------------------------- test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest httpx

      - name: Run tests
        working-directory: app
        run: python -m pytest tests/ -v

  # ------------------------------------------------------------ build
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    # Права для джобы. GITHUB_TOKEN создаётся автоматически на время
    # выполнения — свой personal access token сюда класть не нужно.
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # QEMU нужен для кросс-сборки: раннеры GitHub на amd64,
      # а твой кластер на arm64 (Apple Silicon).
      # Без этого образ не запустится на нодах: exec format error.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Генерирует теги по правилам: short SHA для коммитов,
      # версия для git-тегов, latest для main.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          # Кэш слоёв между запусками — иначе каждая сборка с нуля
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------- scan
  scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          # Не валим пайплайн: в базовом образе Python почти всегда
          # найдётся пара CVE, которые ты не контролируешь.
          exit-code: '0'

      # Результаты попадают во вкладку Security репозитория
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ---------------------------------------------------------- package
  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Синхронизируем appVersion с тегом образа, чтобы
      # helm history показывал реальную версию приложения
      - name: Sync appVersion
        run: |
          sed -i "s|^appVersion:.*|appVersion: \"${{ needs.build.outputs.image_tag }}\"|" chart/Chart.yaml
          cat chart/Chart.yaml

      - name: Package chart
        run: helm package ./chart --destination ./dist

      - name: Push chart to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push ./dist/*.tgz oci://ghcr.io/rustamina/charts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          retention-days: 7
