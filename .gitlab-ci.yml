# Пайплайн для demo-api.
#
# Раннер живёт в кластере и создаёт под под каждую джобу.
# Тег k8s обязателен: при регистрации мы сняли галочку
# "Run untagged jobs", поэтому джоба без тега никем не подхватится.

stages:
  - lint
  - test
  - build
  - scan
  - package

variables:
  # Предопределённые переменные GitLab:
  #   CI_REGISTRY_IMAGE  — registry.gitlab.com/khrustik/demo-api
  #   CI_COMMIT_SHORT_SHA — первые 8 символов хеша коммита
  #   CI_COMMIT_TAG      — тег git, если пайплайн запущен по тегу
  IMAGE: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

default:
  tags:
    - k8s

# ---------------------------------------------------------------- lint

lint:python:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check app/
  # allow_failure: линтер не должен блокировать всё на старте.
  # Когда код устаканится — убери эту строку.
  allow_failure: true

lint:helm:
  stage: lint
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  script:
    - helm lint ./chart
    - helm template demo-api ./chart > /dev/null
    - helm template demo-api ./chart -f chart/values-prod.yaml > /dev/null

# ---------------------------------------------------------------- test

test:pytest:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r app/requirements.txt pytest httpx
  script:
    - cd app && python -m pytest tests/ -v

# ---------------------------------------------------------------- build

build:image:
  stage: build
  image:
    # Kaniko собирает образы БЕЗ Docker-демона и без привилегий.
    # В поде Kubernetes демона нет, а docker:dind требует
    # privileged: true — фактически root на ноде.
    # Это стандартный ответ на вопрос "как собирать образы в k8s".
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    # Учётные данные для пуша. CI_REGISTRY_USER и CI_REGISTRY_PASSWORD
    # GitLab подставляет сам — это временный токен на время джобы,
    # свой personal access token сюда класть НЕ нужно.
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" \
        > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$IMAGE:$IMAGE_TAG" \
        --destination "$IMAGE:latest" \
        --build-arg APP_VERSION=$IMAGE_TAG \
        --cache=true \
        --cache-repo "$IMAGE/cache"

# Отдельная джоба: при пуше git-тега собираем образ с этим тегом.
# Так релизные версии получают человекочитаемые имена (1.2.0),
# а обычные коммиты — хеш.
build:release:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" \
        > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$IMAGE:$CI_COMMIT_TAG" \
        --build-arg APP_VERSION=$CI_COMMIT_TAG

# ---------------------------------------------------------------- scan

scan:trivy:
  stage: scan
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_NO_PROGRESS: "true"
    # Кэш базы уязвимостей внутри джобы
    TRIVY_CACHE_DIR: .trivycache/
  script:
    # Первый прогон — просто отчёт по всем находкам
    - trivy image --exit-code 0 --severity LOW,MEDIUM "$IMAGE:$IMAGE_TAG"
    # Второй — падаем, если есть HIGH или CRITICAL
    - trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE:$IMAGE_TAG"
  cache:
    paths:
      - .trivycache/
  # Пока разрешаем падать: в базовом образе Python почти всегда
  # найдётся пара CVE, которые ты не контролируешь.
  # В реальном проекте вместо этого настраивают .trivyignore
  # и регулярное обновление базового образа.
  allow_failure: true

# ---------------------------------------------------------------- package

package:chart:
  stage: package
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  script:
    - apk add --no-cache curl
    # Синхронизируем версию приложения в чарте с тегом образа,
    # чтобы helm history показывал реальную версию,
    # а не захардкоженную в Chart.yaml
    - sed -i "s/^appVersion:.*/appVersion: \"$IMAGE_TAG\"/" chart/Chart.yaml
    - helm package ./chart --destination ./dist
    # Публикация в GitLab Package Registry (встроенный helm-репозиторий)
    - |
      curl --fail --request POST \
        --form "chart=@$(ls ./dist/*.tgz)" \
        --user "gitlab-ci-token:$CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/stable/charts"
  artifacts:
    paths:
      - dist/*.tgz
    expire_in: 1 week
