replicaCount: 2

config:
  GREETING: "Привет из DEV"
  LOG_LEVEL: "DEBUG"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: demo-api-dev.local
      paths:
        - path: /
          pathType: Prefix
