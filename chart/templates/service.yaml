apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-api.fullname" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      {{- /* targetPort: http — ссылка на ИМЕНОВАННЫЙ порт контейнера.
             Лучше, чем число: поменяется порт в Deployment,
             Service подхватит автоматически. */}}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- /* Только selectorLabels, не полный набор.
           Полные лейблы содержат app.kubernetes.io/version, а она
           меняется при каждом релизе — селектор перестал бы
           находить поды предыдущей версии во время rolling update. */}}
    {{- include "demo-api.selectorLabels" . | nindent 4 }}

